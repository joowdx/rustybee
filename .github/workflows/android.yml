# PRs: test and build the app. master: also release it.
#
# Every push to master that touches the app publishes a GitHub release
# v<version> with the signed foss APK, the gms APK when its Firebase config is
# set, and SHA256SUMS. .github/scripts/next-version.sh picks the version from
# the Conventional Commits since the last release (spec 001).
#
# Repository secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD   release signing key (required on master)
#   RUSTYBEE_GOOGLE_SERVICES_JSON             google-services.json for dev.joowdx.rustybee
#                                             (optional; without it no gms APK is built)
name: android
on:
  pull_request:
    paths: ["android/**", "protocol/**", "VERSION", ".github/workflows/android.yml", ".github/scripts/next-version.sh"]
  push:
    branches: [master]
    paths: ["android/**", "protocol/**", "VERSION", ".github/workflows/android.yml", ".github/scripts/next-version.sh"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - id: v
        run: |
          v=$(.github/scripts/next-version.sh)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: \`$v\`" >> "$GITHUB_STEP_SUMMARY"

  apk:
    needs: version
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    env:
      RUSTYBEE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Signing key
        # Only the release reads the key; PR builds stay unsigned.
        if: env.RELEASE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_* secrets"
            exit 1
          fi
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RUSTYBEE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Firebase config (optional)
        env:
          GSJ: ${{ secrets.RUSTYBEE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ "$RELEASE" = true ] && [ -n "$GSJ" ]; then
            printf '%s' "$GSJ" > app/src/gms/google-services.json
            echo "TASKS=assembleFossRelease assembleGmsRelease" >> "$GITHUB_ENV"
          else
            echo "TASKS=assembleFossRelease" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          RUSTYBEE_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          RUSTYBEE_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          RUSTYBEE_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: ./gradlew --no-daemon testFossDebugUnitTest $TASKS
      - name: Check the foss APK (AC-011-01)
        # Under 3 MB, and no Firebase, AppCompat or Compose classes.
        run: ci/check-apk.sh "$(find app/build/outputs/apk/foss/release -name 'app-foss-release*.apk' | sort | head -1)"
      - name: Collect and verify
        run: |
          mkdir -p ../apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          for flavor in foss gms; do
            dir="app/build/outputs/apk/$flavor/release"
            src=$(ls "$dir"/app-$flavor-release*.apk 2>/dev/null | head -1)
            [ -n "$src" ] || continue
            "$apksigner" verify --print-certs "$src" 2>/dev/null | grep 'SHA-256' | sed "s/^/$flavor: /" >> "$GITHUB_STEP_SUMMARY" || true
            cp "$src" "../apk/rustybee-$RUSTYBEE_VERSION-$flavor.apk"
          done
          rm -f "$RUNNER_TEMP/release.jks" app/src/gms/google-services.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk
          path: apk/*
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 1 }}

  # PRs only: the gms flavor must still compile, and release lint must pass.
  # A dummy Firebase config is enough to compile; nothing here is published.
  pr-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with: { cache-read-only: true }
      - name: Dummy Firebase config
        run: cp ci/google-services.dummy.json app/src/gms/google-services.json
      - name: Compile gms and lint foss release
        run: ./gradlew --no-daemon compileGmsReleaseKotlin lintFossRelease

  # PRs only: pair, send and receive on an Android 11 emulator against a local
  # server (AC-011-13). Lint can't see a system service that is null on API 30,
  # or a permission only the old code path needs.
  api30-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with: { cache-read-only: true }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: server, save-if: false }
      - name: Build the server and the foss debug APK
        run: |
          (cd server && cargo build --locked)
          (cd android && ./gradlew --no-daemon assembleFossDebug)
          sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on API 30
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          script: android/ci/api30-smoke.sh server/target/debug/rustybee android/app/build/outputs/apk/foss/debug/app-foss-debug.apk

  release:
    if: github.event_name != 'pull_request'
    needs: [version, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: apk, path: assets }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          cd assets
          sha256sum * > SHA256SUMS
          gh release create "v$V" * -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "rustybee $V" \
            --latest --generate-notes --notes "- \`rustybee-$V-foss.apk\`: the app without Google services (recommended).
          - \`rustybee-$V-gms.apk\`, when present: adds the optional FCM wake-up.
          - \`SHA256SUMS\`: checksums of the above."
