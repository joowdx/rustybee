# Publishes a release when a tag v<VERSION> is pushed:
#   - the container image ghcr.io/<owner>/<repo> for linux/amd64 and linux/arm64,
#     tagged <version>, <major>.<minor>, <major> and latest;
#   - static server binaries for both architectures;
#   - the signed foss APK, plus the gms APK when its Firebase config is set;
#   - SHA256SUMS over every asset.
#
# Cut a release: set VERSION (and server/Cargo.toml), commit, then
#   git tag v$(cat VERSION) && git push origin v$(cat VERSION)
#
# Repository secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD   release signing key (required)
#   RUSTYBEE_GOOGLE_SERVICES_JSON             google-services.json for dev.joowdx.rustybee
#                                             (optional; without it no gms APK is built)
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag, VERSION and Cargo.toml agree
        run: |
          version=$(cat VERSION)
          cargo=$(sed -nE '0,/^version = "([^"]+)"/s//\1/p' server/Cargo.toml)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "::error::tag $GITHUB_REF_NAME but VERSION is $version"; exit 1; }
          test "$cargo" = "$version" || { echo "::error::server/Cargo.toml is $cargo but VERSION is $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      # The final stage is scratch with only the binary and /data, so a local
      # export of it is the static binary.
      - name: Export the static binary
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=out
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
      - id: build
        name: Push the image by digest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
      - run: |
          mkdir -p digests bin
          touch "digests/${DIGEST#sha256:}"
          cp out/rustybee "bin/rustybee-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with: { name: "digest-${{ matrix.arch }}", path: digests/*, retention-days: 1 }
      - uses: actions/upload-artifact@v4
        with: { name: "bin-${{ matrix.arch }}", path: bin/*, retention-days: 1 }

  manifest:
    needs: [version, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: digest-*, merge-multiple: true, path: digests }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - name: Create the multi-arch manifest
        working-directory: digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ needs.version.outputs.version }}"

  apk:
    needs: version
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KS" || { echo "::error::Set the ANDROID_KEYSTORE_* secrets"; exit 1; }
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RUSTYBEE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Firebase config (optional)
        env:
          GSJ: ${{ secrets.RUSTYBEE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            printf '%s' "$GSJ" > app/src/gms/google-services.json
            echo "TASKS=assembleFossRelease assembleGmsRelease" >> "$GITHUB_ENV"
          else
            echo "TASKS=assembleFossRelease" >> "$GITHUB_ENV"
            echo "No RUSTYBEE_GOOGLE_SERVICES_JSON secret; skipping the gms APK" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build
        env:
          RUSTYBEE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RUSTYBEE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RUSTYBEE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testFossDebugUnitTest $TASKS
      - name: Collect and verify
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p ../apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          for flavor in foss gms; do
            src="app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            [ -f "$src" ] || continue
            "$apksigner" verify --print-certs "$src" | grep 'SHA-256' | sed "s/^/$flavor: /" >> "$GITHUB_STEP_SUMMARY"
            cp "$src" "../apk/rustybee-$V-$flavor.apk"
          done
          rm -f "$RUNNER_TEMP/release.jks" app/src/gms/google-services.json
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: apk/*, retention-days: 1 }

  release:
    needs: [version, manifest, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: bin-*, merge-multiple: true, path: assets }
      - uses: actions/download-artifact@v4
        with: { name: apk, path: assets }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          cd assets
          chmod +x rustybee-*-linux-* || true
          sha256sum * > SHA256SUMS
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          gh release create "v$V" * -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "rustybee $V" \
            --latest --notes "Container image: \`$image:$V\` (linux/amd64, linux/arm64).

          - \`rustybee-$V-foss.apk\`: the app without Google services (recommended).
          - \`rustybee-$V-gms.apk\`, when present: adds the optional FCM wake-up.
          - \`rustybee-$V-linux-{amd64,arm64}\`: static server binaries for \`deploy/rustybee.service\`.
          - \`SHA256SUMS\`: checksums of the above."
