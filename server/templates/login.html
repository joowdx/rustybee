{% extends "base.html" %}
{% block content %}
<section class="login card">
  <h1>rustybee</h1>
  {% if has_password %}
  
  <form method="post" action="/login" class="stack" hx-boost="false">
    <label>Password <input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <button>Log in</button>
  </form>
  {% else %}
  <p>No admin password is set. Run <code>rustybee set-password</code> on the server, or start it once with <code>RUSTYBEE_ADMIN_PASSWORD</code>.</p>
  {% endif %}
</section>
{% endblock %}
