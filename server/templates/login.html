{% extends "base.html" %}
{% block content %}
<section class="login">
  <img class="mark" src="{{ l.logo }}" alt="" width="72" height="72">
  <h1>rustybee</h1>
  <p class="lede">Log in to your SMS gateway</p>
  {% if has_password %}
  <form method="post" action="/login" class="card stack" hx-boost="false">
    <label><span class="lbl">Password</span><input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <button>Log in</button>
  </form>
  {% else %}
  <p class="card" style="text-align:left">No admin password is set. Run <code>rustybee set-password</code> on the server, or start it once with <code>RUSTYBEE_ADMIN_PASSWORD</code>.</p>
  {% endif %}
</section>
{% endblock %}
