{% extends "base.html" %}
{% block content %}
<section class="login card">
  <div class="brand"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 20.5 7.4v9.2L12 21.5l-8.5-4.9V7.4z"/></svg>rustybee</div>
  <h1 class="login-h">Log in to your SMS gateway</h1>
  {% if has_password %}
  <form method="post" action="/login" class="stack" hx-boost="false">
    <label>Password <input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <button>Log in</button>
  </form>
  {% else %}
  <p>No admin password is set. Run <code>rustybee set-password</code> on the server, or start it once with <code>RUSTYBEE_ADMIN_PASSWORD</code>.</p>
  {% endif %}
</section>
{% endblock %}
