{% extends "base.html" %}
{% block content %}
<div class="head">
  <h1>Overview</h1>
  <a class="btn" href="/send">Send a message</a>
</div>
<div hx-ext="sse" sse-connect="/events">
  <span hidden hx-trigger="sse:device, sse:message" data-refresh="live"></span>
  <div id="live" hx-get="/partials/dashboard" hx-trigger="refresh-live" hx-swap="innerHTML">
  {% include "_dashboard.html" %}
  </div>
</div>
{% endblock %}
